name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # No database service. The domain tests use in-memory SQLite, so the suite
    # has to stay runnable with nothing but Python. If a test ever needs
    # PostgreSQL semantics, add a service block here rather than weakening the
    # test.
    env:
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      JWT_SECRET: ulearn-ci-suite-signing-key-0123456789abcdef
      JWT_ALGORITHM: HS256

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: |
          python -m pip install ruff
          ruff check .
          ruff format --check .

      - name: Test
        working-directory: backend
        run: python -m pytest --cov=app --cov-report=term-missing
