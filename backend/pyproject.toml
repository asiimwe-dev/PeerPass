[project]
name = "peerpass-backend"
version = "0.1.0"
description = "FastAPI service for the PeerPass peer tutoring network"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    # N818 wants every exception named `*Error`. The `*Problem` suffix mirrors
    # RFC 9457 terminology, and the obvious rename -- ValidationProblem to
    # ValidationError -- would collide with `pydantic.ValidationError`, which is
    # used in the same modules to mean something else entirely.
    "N818",
]
