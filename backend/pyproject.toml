[project]
name = "peerpass-backend"
version = "0.1.0"
description = "FastAPI service for the PeerPass peer tutoring network"
# 3.14, not 3.12. `app.core.security.new_uuid7` needs `uuid.uuid7`, and every
# primary key in the database goes through it. Declaring a lower floor here let
# the suite pass only because no test constructed a `User`; the first test that
# does would have failed on CI while passing locally.
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py314"
# Autogenerate output is regenerated, not edited. Reformatting it produces a
# diff nobody can meaningfully review, because the next `--autogenerate` run
# reintroduces the same long lines and the churn hides the real changes. Linting
# still applies; only the formatter is kept away from it.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    # N818 wants every exception named `*Error`. The `*Problem` suffix mirrors
    # RFC 9457 terminology, and the obvious rename -- ValidationProblem to
    # ValidationError -- would collide with `pydantic.ValidationError`, which is
    # used in the same modules to mean something else entirely.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# Same reason as the format exclusion above: a migration is written by
# `--autogenerate`, and its shape is SQLAlchemy's to decide. The checks that
# still matter on a migration -- unused imports, undefined names -- stay on.
"alembic/versions/*" = ["E501", "I001"]
