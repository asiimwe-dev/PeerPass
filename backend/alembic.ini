# Alembic configuration.
#
# The database URL is deliberately absent. `alembic/env.py` reads it from the
# application settings instead, so there is exactly one place a connection string
# is configured and no way for a migration to run against a different database
# than the service it is migrating.
#
# `script_location` is relative to this file, so the CLI works from `backend/`.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Timestamped revision filenames sort chronologically, which matters once there
# is more than one migration and a merge conflict has to be resolved by reading
# which came first.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# A migration that produced a schema the models do not describe has created a
# situation where the test suite -- which builds from the models with
# `create_all` -- passes while the deployed database disagrees with it. Nothing
# else in the toolchain would notice, so the comparison is made explicit.
compare_type = true
compare_server_default = true

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
